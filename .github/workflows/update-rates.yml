name: Update mortgage rates

# Refreshes rates.json every day from the Freddie Mac weekly average
# (published Thursdays) via the St. Louis Fed FRED series. The daily commit
# also keeps this scheduled workflow from being auto-disabled for inactivity.

on:
  schedule:
    - cron: '0 15 * * *'   # 15:00 UTC daily (~8am AZ)
  workflow_dispatch:        # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # FRED occasionally answers with a page that isn't the CSV while still
      # reporting success, so check what came back and try again before
      # giving up. A bad reply never overwrites rates.json.
      - name: Download Freddie Mac rates from FRED
        run: |
          set -uo pipefail
          for id in MORTGAGE30US MORTGAGE15US; do
            ok=no
            for attempt in 1 2 3 4 5; do
              curl -sSL --retry 3 --retry-all-errors -A "92-rates-bot" \
                -o "$id.csv" -w "$id attempt $attempt: HTTP %{http_code}, %{size_download} bytes\n" \
                "https://fred.stlouisfed.org/graph/fredgraph.csv?id=$id" || true
              if grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2},[0-9]' "$id.csv" 2>/dev/null; then
                ok=yes; break
              fi
              echo "  Not the expected CSV. First lines received:"; head -n 5 "$id.csv" 2>/dev/null | sed 's/^/    /'
              sleep $((attempt * 20))
            done
            if [ "$ok" != yes ]; then
              echo "::error::FRED did not return usable $id data after 5 tries. rates.json left unchanged."
              exit 1
            fi
            echo "  last row: $(tail -n 1 "$id.csv")"
          done

      - name: Write rates.json
        shell: python
        run: |
          import csv, datetime, json, re, sys

          def latest(series):
              path = f"{series}.csv"
              with open(path, newline="", encoding="utf-8-sig") as f:
                  rows = [r for r in csv.reader(f) if len(r) >= 2]
              good = [(r[0].strip(), r[1].strip()) for r in rows
                      if re.fullmatch(r"\d{4}-\d{2}-\d{2}", r[0].strip())
                      and re.fullmatch(r"\d+(\.\d+)?", r[1].strip())]
              if not good:
                  print(f"::error::No usable rows in {path}. First 5 lines of the file:")
                  with open(path, encoding="utf-8", errors="replace") as f:
                      for _ in range(5):
                          print("  " + f.readline().rstrip())
                  sys.exit(1)
              return good[-1]

          d30, v30 = latest("MORTGAGE30US")
          _,   v15 = latest("MORTGAGE15US")
          day = datetime.date.fromisoformat(d30)
          now = datetime.datetime.now(datetime.timezone.utc)

          # Numbers are written exactly as FRED publishes them (e.g. 7.40).
          body = (
              "{\n"
              f'  "rate30": {v30},\n'
              f'  "rate15": {v15},\n'
              f'  "asOf": {json.dumps(day.strftime("%b ") + str(day.day) + day.strftime(", %Y"))},\n'
              f'  "asOfISO": "{d30}",\n'
              '  "source": "Freddie Mac PMMS via FRED",\n'
              f'  "updated": "{now.strftime("%Y-%m-%dT%H:%M:%SZ")}"\n'
              "}\n"
          )
          json.loads(body)  # refuse to write anything that isn't valid JSON
          with open("rates.json", "w", encoding="utf-8") as f:
              f.write(body)
          print("Wrote:\n" + body)

      - name: Commit if changed
        run: |
          git config user.name "rates-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rates.json
          git diff --staged --quiet || git commit -m "Update rates ($(date -u +%F))"
          git push
